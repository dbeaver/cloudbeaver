prop.auth.model.ldap.ldap-host=Host
prop.auth.model.ldap.ldap-host.description=Host del server LDAP
prop.auth.model.ldap.ldap-port=Porta
prop.auth.model.ldap.ldap-port.description=Porta del server LDAP, predefinita: 389
prop.auth.model.ldap.ldap-identifier-attr=Attributo identificativo dell'utente
prop.auth.model.ldap.ldap-identifier-attr.description=Attributo LDAP utilizzato come ID utente. Durante l'autorizzazione viene aggiunto automaticamente all'inizio del valore «DN utente» se non è specificato esplicitamente
prop.auth.model.ldap.ldap-dn=Nome distinto di base
prop.auth.model.ldap.ldap-dn.description=Nome distinto di base valido per tutti gli utenti, esempio: dc=myOrg,dc=com. Durante l'autorizzazione viene aggiunto automaticamente alla fine del valore «DN utente» se non è specificato esplicitamente. Lasciare vuoto per utilizzare il DN radice.
prop.auth.model.ldap.ldap-bind-user=DN dell'utente di associazione
prop.auth.model.ldap.ldap-bind-user.description=DN dell'utente autorizzato a cercare gli utenti per verificarne l'accesso all'applicazione con il filtro specificato.
prop.auth.model.ldap.ldap-bind-user-pwd=Password dell'utente di associazione
prop.auth.model.ldap.ldap-bind-user-pwd.description=Password dell'utente di associazione.
prop.auth.model.ldap.ldap-filter=Filtro utenti
prop.auth.model.ldap.ldap-filter.description=Filtro utilizzato per verificare l'accesso degli utenti all'applicazione. Per utilizzare il filtro è obbligatorio configurare l'utente di associazione.
prop.auth.model.ldap.ldap-login=Parametro di accesso dell'utente
prop.auth.model.ldap.ldap-login.description=Attributo LDAP da utilizzare come nome di accesso dell'utente. L'attributo deve essere univoco. Per utilizzare questo parametro è obbligatorio configurare l'utente di associazione.
prop.auth.model.ldap.ldap-enable-ssl=Abilita SSL
prop.auth.model.ldap.ldap-enable-ssl.description=Utilizza una connessione SSL sicura al server LDAP
prop.auth.model.ldap.ldap-ssl-cert=Certificato (formato PEM)
prop.auth.model.ldap.ldap-ssl-cert.description=Certificato con codifica PEM utilizzato per convalidare il server LDAP quando SSL è abilitato
prop.auth.model.ldap.ldap-referral=Gestione dei riferimenti
prop.auth.model.ldap.ldap-referral.description=Specifica come gestire i riferimenti LDAP. Il valore predefinito è 'ignore'
prop.auth.model.ldap.ldap-first-name-field=Campo del nome
prop.auth.model.ldap.ldap-first-name-field.description=Attributo LDAP utilizzato per compilare il nome nel profilo utente se vuoto. I valori esistenti vengono mantenuti. Lasciare vuoto per disabilitare la mappatura
prop.auth.model.ldap.ldap-last-name-field=Campo del cognome
prop.auth.model.ldap.ldap-last-name-field.description=Attributo LDAP utilizzato per compilare il cognome nel profilo utente se vuoto. I valori esistenti vengono mantenuti. Lasciare vuoto per disabilitare la mappatura
