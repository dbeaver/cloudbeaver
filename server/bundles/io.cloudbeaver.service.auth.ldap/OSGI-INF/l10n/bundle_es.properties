prop.auth.model.ldap.ldap-host=Host
prop.auth.model.ldap.ldap-host.description=Host del servidor LDAP
prop.auth.model.ldap.ldap-port=Puerto
prop.auth.model.ldap.ldap-port.description=Puerto del servidor LDAP, predeterminado: 389
prop.auth.model.ldap.ldap-identifier-attr=Atributo identificador del usuario
prop.auth.model.ldap.ldap-identifier-attr.description=Atributo LDAP utilizado como ID de usuario. Se añade automáticamente al principio del valor «DN del usuario» durante la autorización si no se especifica explícitamente
prop.auth.model.ldap.ldap-dn=Nombre distinguido base
prop.auth.model.ldap.ldap-dn.description=Nombre distinguido base aplicable a todos los usuarios, ejemplo: dc=myOrg,dc=com. Se añade automáticamente al final del valor «DN del usuario» durante la autorización si no se especifica explícitamente. Déjelo vacío para utilizar el DN raíz.
prop.auth.model.ldap.ldap-bind-user=DN del usuario de enlace
prop.auth.model.ldap.ldap-bind-user.description=DN del usuario con permisos para buscar usuarios y comprobar su acceso a la aplicación con el filtro especificado.
prop.auth.model.ldap.ldap-bind-user-pwd=Contraseña del usuario de enlace
prop.auth.model.ldap.ldap-bind-user-pwd.description=Contraseña del usuario de enlace.
prop.auth.model.ldap.ldap-filter=Filtro de usuarios
prop.auth.model.ldap.ldap-filter.description=Filtro utilizado para verificar el acceso de los usuarios a la aplicación. Para utilizar el filtro es obligatorio configurar el usuario de enlace.
prop.auth.model.ldap.ldap-login=Parámetro de inicio de sesión del usuario
prop.auth.model.ldap.ldap-login.description=Atributo LDAP que se utilizará como nombre de inicio de sesión del usuario. El atributo debe ser único. Para utilizar este parámetro es obligatorio configurar el usuario de enlace.
prop.auth.model.ldap.ldap-enable-ssl=Activar SSL
prop.auth.model.ldap.ldap-enable-ssl.description=Utiliza una conexión SSL segura con el servidor LDAP
prop.auth.model.ldap.ldap-ssl-cert=Certificado (formato PEM)
prop.auth.model.ldap.ldap-ssl-cert.description=Certificado codificado en PEM utilizado para validar el servidor LDAP cuando SSL está activado
prop.auth.model.ldap.ldap-referral=Gestión de referencias
prop.auth.model.ldap.ldap-referral.description=Especifica cómo se gestionan las referencias LDAP. El valor predeterminado es 'ignore'
prop.auth.model.ldap.ldap-first-name-field=Campo del nombre
prop.auth.model.ldap.ldap-first-name-field.description=Atributo LDAP utilizado para rellenar el nombre en el perfil del usuario si está vacío. Se conservan los valores existentes. Déjelo vacío para desactivar la asignación
prop.auth.model.ldap.ldap-last-name-field=Campo del apellido
prop.auth.model.ldap.ldap-last-name-field.description=Atributo LDAP utilizado para rellenar el apellido en el perfil del usuario si está vacío. Se conservan los valores existentes. Déjelo vacío para desactivar la asignación
