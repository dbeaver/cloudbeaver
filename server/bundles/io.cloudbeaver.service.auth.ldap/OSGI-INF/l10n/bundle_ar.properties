prop.auth.model.ldap.ldap-host = المضيف
prop.auth.model.ldap.ldap-host.description = مضيف خادم LDAP
prop.auth.model.ldap.ldap-port = المنفذ
prop.auth.model.ldap.ldap-port.description = منفذ خادم LDAP، الافتراضي هو 389
prop.auth.model.ldap.ldap-identifier-attr = سمة معرف المستخدم
prop.auth.model.ldap.ldap-identifier-attr.description = سمة LDAP المستخدمة كمعرف للمستخدم. تضاف تلقائيا إلى بداية قيمة «الاسم المميز للمستخدم» أثناء التخويل إذا لم تحدد صراحة
prop.auth.model.ldap.ldap-dn = الاسم المميز الأساسي
prop.auth.model.ldap.ldap-dn.description = الاسم المميز الأساسي المطبق على جميع المستخدمين، مثال: dc=myOrg,dc=com. يضاف تلقائيا إلى نهاية قيمة «الاسم المميز للمستخدم» أثناء التخويل إذا لم يحدد صراحة. اتركه فارغا لاستخدام الاسم المميز الجذري.
prop.auth.model.ldap.ldap-bind-user = الاسم المميز لمستخدم الربط
prop.auth.model.ldap.ldap-bind-user.description = الاسم المميز للمستخدم الذي يملك صلاحية البحث عن المستخدمين للتحقق من حق الوصول إلى التطبيق باستخدام عامل التصفية المحدد.
prop.auth.model.ldap.ldap-bind-user-pwd = كلمة مرور مستخدم الربط
prop.auth.model.ldap.ldap-bind-user-pwd.description = كلمة مرور مستخدم الربط.
prop.auth.model.ldap.ldap-filter = عامل تصفية المستخدمين
prop.auth.model.ldap.ldap-filter.description = عامل التصفية المستخدم للتحقق من حق وصول المستخدمين إلى التطبيق. يتطلب استخدام عامل التصفية إعداد مستخدم الربط.
prop.auth.model.ldap.ldap-login = معلمة تسجيل دخول المستخدم
prop.auth.model.ldap.ldap-login.description = سمة LDAP المستخدمة كاسم تسجيل دخول المستخدم. يجب أن تكون السمة فريدة. يتطلب استخدام هذه المعلمة إعداد مستخدم الربط.
prop.auth.model.ldap.ldap-enable-ssl = تفعيل SSL
prop.auth.model.ldap.ldap-enable-ssl.description = استخدام اتصال SSL آمن بخادم LDAP
prop.auth.model.ldap.ldap-ssl-cert = الشهادة (بتنسيق PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = شهادة بترميز PEM تستخدم للتحقق من خادم LDAP عند تفعيل SSL
prop.auth.model.ldap.ldap-referral = معالجة الإحالات
prop.auth.model.ldap.ldap-referral.description = تحديد كيفية معالجة إحالات LDAP. القيمة الافتراضية هي 'ignore'
prop.auth.model.ldap.ldap-first-name-field = حقل الاسم الأول
prop.auth.model.ldap.ldap-first-name-field.description = سمة LDAP المستخدمة لملء الاسم الأول الفارغ في ملف المستخدم. يتم الاحتفاظ بالقيم الموجودة. اتركه فارغا لتعطيل التعيين
prop.auth.model.ldap.ldap-last-name-field = حقل اسم العائلة
prop.auth.model.ldap.ldap-last-name-field.description = سمة LDAP المستخدمة لملء اسم العائلة الفارغ في ملف المستخدم. يتم الاحتفاظ بالقيم الموجودة. اتركه فارغا لتعطيل التعيين
