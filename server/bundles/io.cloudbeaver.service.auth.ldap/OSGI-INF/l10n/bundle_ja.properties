prop.auth.model.ldap.ldap-host = ホスト
prop.auth.model.ldap.ldap-host.description = LDAP サーバーのホスト
prop.auth.model.ldap.ldap-port = ポート
prop.auth.model.ldap.ldap-port.description = LDAP サーバーのポート。デフォルトは 389 です
prop.auth.model.ldap.ldap-identifier-attr = ユーザー識別子の属性
prop.auth.model.ldap.ldap-identifier-attr.description = ユーザー ID として使用する LDAP 属性。明示的に指定されていない場合、認可時に「ユーザー DN」の値の先頭に自動的に追加されます
prop.auth.model.ldap.ldap-dn = ベース識別名
prop.auth.model.ldap.ldap-dn.description = すべてのユーザーに適用されるベース識別名。例: dc=myOrg,dc=com。明示的に指定されていない場合、認可時に「ユーザー DN」の値の末尾に自動的に追加されます。ルート DN を使用する場合は空欄にしてください。
prop.auth.model.ldap.ldap-bind-user = バインドユーザー DN
prop.auth.model.ldap.ldap-bind-user.description = 指定されたフィルターを使用してアプリケーションへのアクセス権を確認するために、ユーザーを検索する権限を持つユーザーの DN。
prop.auth.model.ldap.ldap-bind-user-pwd = バインドユーザーのパスワード
prop.auth.model.ldap.ldap-bind-user-pwd.description = バインドユーザーのパスワード。
prop.auth.model.ldap.ldap-filter = ユーザーフィルター
prop.auth.model.ldap.ldap-filter.description = アプリケーションへのユーザーのアクセス権を確認するためのフィルター。このフィルターを使用するには、バインドユーザーの設定が必須です。
prop.auth.model.ldap.ldap-login = ユーザーログインのパラメーター
prop.auth.model.ldap.ldap-login.description = ユーザーのログインに使用する LDAP 属性。この属性は一意である必要があります。このパラメーターを使用するには、バインドユーザーの設定が必須です。
prop.auth.model.ldap.ldap-enable-ssl = SSL を有効にする
prop.auth.model.ldap.ldap-enable-ssl.description = LDAP サーバーへの接続に安全な SSL 接続を使用します
prop.auth.model.ldap.ldap-ssl-cert = 証明書（PEM 形式）
prop.auth.model.ldap.ldap-ssl-cert.description = SSL が有効な場合に LDAP サーバーを検証するための PEM 形式の証明書
prop.auth.model.ldap.ldap-referral = リフェラルの処理
prop.auth.model.ldap.ldap-referral.description = LDAP リフェラルの処理方法を指定します。デフォルトは 'ignore' です
prop.auth.model.ldap.ldap-first-name-field = 名フィールド
prop.auth.model.ldap.ldap-first-name-field.description = ユーザープロファイルの名が空の場合に、その値を設定するための LDAP 属性。既存の値は保持されます。マッピングを無効にするには空欄にしてください
prop.auth.model.ldap.ldap-last-name-field = 姓フィールド
prop.auth.model.ldap.ldap-last-name-field.description = ユーザープロファイルの姓が空の場合に、その値を設定するための LDAP 属性。既存の値は保持されます。マッピングを無効にするには空欄にしてください
