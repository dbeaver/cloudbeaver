prop.auth.model.ldap.ldap-host = Host
prop.auth.model.ldap.ldap-host.description = Host des LDAP-Servers
prop.auth.model.ldap.ldap-port = Port
prop.auth.model.ldap.ldap-port.description = Port des LDAP-Servers, Standard ist 389
prop.auth.model.ldap.ldap-identifier-attr = Attribut für die Benutzerkennung
prop.auth.model.ldap.ldap-identifier-attr.description = LDAP-Attribut, das als Benutzer-ID verwendet wird. Wird bei der Autorisierung automatisch am Anfang des Werts „Benutzer-DN“ eingefügt, wenn es nicht ausdrücklich angegeben ist
prop.auth.model.ldap.ldap-dn = Basis-DN
prop.auth.model.ldap.ldap-dn.description = Für alle Benutzer geltender Basis-DN, zum Beispiel: dc=myOrg,dc=com. Wird bei der Autorisierung automatisch am Ende des Werts „Benutzer-DN“ angefügt, wenn er nicht ausdrücklich angegeben ist. Leer lassen, um den Stamm-DN zu verwenden.
prop.auth.model.ldap.ldap-bind-user = Bind-Benutzer-DN
prop.auth.model.ldap.ldap-bind-user.description = DN des Benutzers, der nach Benutzern suchen darf, um deren Zugriff auf die Anwendung mit dem angegebenen Filter zu prüfen.
prop.auth.model.ldap.ldap-bind-user-pwd = Bind-Benutzerpasswort
prop.auth.model.ldap.ldap-bind-user-pwd.description = Passwort des Bind-Benutzers.
prop.auth.model.ldap.ldap-filter = Benutzerfilter
prop.auth.model.ldap.ldap-filter.description = Filter zur Überprüfung des Benutzerzugriffs auf die Anwendung. Zur Verwendung des Filters muss der Bind-Benutzer konfiguriert werden.
prop.auth.model.ldap.ldap-login = Benutzer-Anmeldeparameter
prop.auth.model.ldap.ldap-login.description = LDAP-Attribut, das als Anmeldename des Benutzers verwendet wird. Das Attribut muss eindeutig sein. Zur Verwendung dieses Parameters muss der Bind-Benutzer konfiguriert werden.
prop.auth.model.ldap.ldap-enable-ssl = SSL aktivieren
prop.auth.model.ldap.ldap-enable-ssl.description = Eine sichere SSL-Verbindung zum LDAP-Server verwenden
prop.auth.model.ldap.ldap-ssl-cert = Zertifikat (PEM-Format)
prop.auth.model.ldap.ldap-ssl-cert.description = PEM-kodiertes Zertifikat zur Validierung des LDAP-Servers bei aktiviertem SSL
prop.auth.model.ldap.ldap-referral = Behandlung von LDAP-Verweisen
prop.auth.model.ldap.ldap-referral.description = Festlegen, wie LDAP-Verweise behandelt werden. Standard ist 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Vornamenfeld
prop.auth.model.ldap.ldap-first-name-field.description = LDAP-Attribut zum Ausfüllen eines leeren Vornamens im Benutzerprofil. Vorhandene Werte bleiben erhalten. Leer lassen, um die Zuordnung zu deaktivieren
prop.auth.model.ldap.ldap-last-name-field = Nachnamenfeld
prop.auth.model.ldap.ldap-last-name-field.description = LDAP-Attribut zum Ausfüllen eines leeren Nachnamens im Benutzerprofil. Vorhandene Werte bleiben erhalten. Leer lassen, um die Zuordnung zu deaktivieren
