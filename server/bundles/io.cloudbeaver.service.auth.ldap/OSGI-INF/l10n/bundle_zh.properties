prop.auth.model.ldap.ldap-host = 主机
prop.auth.model.ldap.ldap-host.description = LDAP 服务器主机
prop.auth.model.ldap.ldap-port = 端口
prop.auth.model.ldap.ldap-port.description = LDAP 服务器端口，默认为 389
prop.auth.model.ldap.ldap-identifier-attr = 用户标识符属性
prop.auth.model.ldap.ldap-identifier-attr.description = 用作用户 ID 的 LDAP 属性。授权时，若未明确指定，将自动添加到“用户 DN”值的开头
prop.auth.model.ldap.ldap-dn = 基础可分辨名称
prop.auth.model.ldap.ldap-dn.description = 适用于所有用户的基础可分辨名称，例如：dc=myOrg,dc=com。授权时，若未明确指定，将自动添加到“用户 DN”值的末尾。留空则使用根 DN。
prop.auth.model.ldap.ldap-bind-user = 绑定用户 DN
prop.auth.model.ldap.ldap-bind-user.description = 具有用户搜索权限的用户 DN，用于按指定的筛选器检查用户是否有权访问应用程序。
prop.auth.model.ldap.ldap-bind-user-pwd = 绑定用户密码
prop.auth.model.ldap.ldap-bind-user-pwd.description = 绑定用户的密码。
prop.auth.model.ldap.ldap-filter = 用户筛选器
prop.auth.model.ldap.ldap-filter.description = 用于验证用户是否有权访问应用程序的筛选器。使用筛选器前必须配置绑定用户。
prop.auth.model.ldap.ldap-login = 用户登录参数
prop.auth.model.ldap.ldap-login.description = 用作用户登录名的 LDAP 属性。此属性必须唯一。使用此参数前必须配置绑定用户。
prop.auth.model.ldap.ldap-enable-ssl = 启用 SSL
prop.auth.model.ldap.ldap-enable-ssl.description = 使用安全的 SSL 连接访问 LDAP 服务器
prop.auth.model.ldap.ldap-ssl-cert = 证书（PEM 格式）
prop.auth.model.ldap.ldap-ssl-cert.description = 启用 SSL 时用于验证 LDAP 服务器的 PEM 编码证书
prop.auth.model.ldap.ldap-referral = 引用处理
prop.auth.model.ldap.ldap-referral.description = 指定 LDAP 引用的处理方式。默认为 'ignore'
prop.auth.model.ldap.ldap-first-name-field = 名字字段
prop.auth.model.ldap.ldap-first-name-field.description = 用于填充用户个人资料中空缺名字的 LDAP 属性。保留现有值。留空则禁用此映射
prop.auth.model.ldap.ldap-last-name-field = 姓氏字段
prop.auth.model.ldap.ldap-last-name-field.description = 用于填充用户个人资料中空缺姓氏的 LDAP 属性。保留现有值。留空则禁用此映射
