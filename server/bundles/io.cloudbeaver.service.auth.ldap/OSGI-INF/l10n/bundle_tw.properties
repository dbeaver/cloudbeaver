prop.auth.model.ldap.ldap-host = 主機
prop.auth.model.ldap.ldap-host.description = LDAP 伺服器主機
prop.auth.model.ldap.ldap-port = 連接埠
prop.auth.model.ldap.ldap-port.description = LDAP 伺服器連接埠，預設為 389
prop.auth.model.ldap.ldap-identifier-attr = 使用者識別碼屬性
prop.auth.model.ldap.ldap-identifier-attr.description = 用作使用者 ID 的 LDAP 屬性。授權時，若未明確指定，將自動新增至「使用者 DN」值的開頭
prop.auth.model.ldap.ldap-dn = 基底辨別名稱
prop.auth.model.ldap.ldap-dn.description = 適用於所有使用者的基底辨別名稱，例如：dc=myOrg,dc=com。授權時，若未明確指定，將自動新增至「使用者 DN」值的結尾。留空則使用根 DN。
prop.auth.model.ldap.ldap-bind-user = 繫結使用者 DN
prop.auth.model.ldap.ldap-bind-user.description = 具有使用者搜尋權限的使用者 DN，用於依指定的篩選器檢查使用者是否有權存取應用程式。
prop.auth.model.ldap.ldap-bind-user-pwd = 繫結使用者密碼
prop.auth.model.ldap.ldap-bind-user-pwd.description = 繫結使用者的密碼。
prop.auth.model.ldap.ldap-filter = 使用者篩選器
prop.auth.model.ldap.ldap-filter.description = 用於驗證使用者是否有權存取應用程式的篩選器。使用篩選器前必須設定繫結使用者。
prop.auth.model.ldap.ldap-login = 使用者登入參數
prop.auth.model.ldap.ldap-login.description = 用作使用者登入名稱的 LDAP 屬性。此屬性必須唯一。使用此參數前必須設定繫結使用者。
prop.auth.model.ldap.ldap-enable-ssl = 啟用 SSL
prop.auth.model.ldap.ldap-enable-ssl.description = 使用安全的 SSL 連線存取 LDAP 伺服器
prop.auth.model.ldap.ldap-ssl-cert = 憑證（PEM 格式）
prop.auth.model.ldap.ldap-ssl-cert.description = 啟用 SSL 時用於驗證 LDAP 伺服器的 PEM 編碼憑證
prop.auth.model.ldap.ldap-referral = 轉介處理
prop.auth.model.ldap.ldap-referral.description = 指定 LDAP 轉介的處理方式。預設為 'ignore'
prop.auth.model.ldap.ldap-first-name-field = 名字欄位
prop.auth.model.ldap.ldap-first-name-field.description = 用於填入使用者個人資料中空缺名字的 LDAP 屬性。保留現有值。留空則停用此對應
prop.auth.model.ldap.ldap-last-name-field = 姓氏欄位
prop.auth.model.ldap.ldap-last-name-field.description = 用於填入使用者個人資料中空缺姓氏的 LDAP 屬性。保留現有值。留空則停用此對應
