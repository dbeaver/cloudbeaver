prop.auth.model.ldap.ldap-host = Хост
prop.auth.model.ldap.ldap-host.description = Хост сервера LDAP
prop.auth.model.ldap.ldap-port = Порт
prop.auth.model.ldap.ldap-port.description = Порт сервера LDAP, по умолчанию 389
prop.auth.model.ldap.ldap-identifier-attr = Атрибут идентификатора пользователя
prop.auth.model.ldap.ldap-identifier-attr.description = Атрибут LDAP, используемый в качестве идентификатора пользователя. Автоматически добавляется в начало значения 'User DN' при авторизации, если не указан явно
prop.auth.model.ldap.ldap-dn = Базовое отличительное имя (DN)
prop.auth.model.ldap.ldap-dn.description = Базовое отличительное имя, общее для всех пользователей, например: dc=myOrg,dc=com. Автоматически добавляется в конец значения 'User DN' при авторизации, если не указано явно. Оставьте пустым, чтобы использовать корневой DN.
prop.auth.model.ldap.ldap-bind-user = DN пользователя для привязки
prop.auth.model.ldap.ldap-bind-user.description = DN пользователя с правами на поиск пользователей для проверки доступа к приложению с указанным фильтром.
prop.auth.model.ldap.ldap-bind-user-pwd = Пароль пользователя для привязки
prop.auth.model.ldap.ldap-bind-user-pwd.description = Пароль пользователя для привязки.
prop.auth.model.ldap.ldap-filter = Фильтр пользователей
prop.auth.model.ldap.ldap-filter.description = Фильтр для проверки доступа пользователей к приложению. Для использования фильтра необходимо настроить пользователя для привязки.
prop.auth.model.ldap.ldap-login = Параметр логина пользователя
prop.auth.model.ldap.ldap-login.description = Атрибут LDAP, используемый в качестве логина пользователя. Атрибут должен быть уникальным. Для использования этого параметра необходимо настроить пользователя для привязки.
prop.auth.model.ldap.ldap-enable-ssl = Включить SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Использовать защищённое SSL-соединение с сервером LDAP
prop.auth.model.ldap.ldap-ssl-cert = Сертификат (в формате PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Сертификат в формате PEM для проверки подлинности сервера LDAP при включённом SSL
prop.auth.model.ldap.ldap-referral = Обработка перенаправлений
prop.auth.model.ldap.ldap-referral.description = Укажите способ обработки перенаправлений LDAP. По умолчанию 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Поле имени
prop.auth.model.ldap.ldap-first-name-field.description = Атрибут LDAP для заполнения пустого имени в профиле пользователя. Существующие значения сохраняются. Оставьте пустым, чтобы отключить сопоставление
prop.auth.model.ldap.ldap-last-name-field = Поле фамилии
prop.auth.model.ldap.ldap-last-name-field.description = Атрибут LDAP для заполнения пустой фамилии в профиле пользователя. Существующие значения сохраняются. Оставьте пустым, чтобы отключить сопоставление
