prop.auth.model.ldap.ldap-host = Gazdă
prop.auth.model.ldap.ldap-host.description = Gazda serverului LDAP
prop.auth.model.ldap.ldap-port = Port
prop.auth.model.ldap.ldap-port.description = Portul serverului LDAP, valoarea implicită este 389
prop.auth.model.ldap.ldap-identifier-attr = Atribut de identificare a utilizatorului
prop.auth.model.ldap.ldap-identifier-attr.description = Atribut LDAP folosit ca ID de utilizator. Va fi adăugat automat la începutul valorii 'DN utilizator' în timpul autorizării dacă nu este specificat explicit
prop.auth.model.ldap.ldap-dn = Nume distinctiv de bază
prop.auth.model.ldap.ldap-dn.description = Nume distinctiv de bază aplicabil tuturor utilizatorilor, exemplu: dc=myOrg,dc=com. Va fi adăugat automat la sfârșitul valorii 'DN utilizator' în timpul autorizării dacă nu este specificat explicit. Lăsați necompletat pentru a utiliza DN-ul rădăcină.
prop.auth.model.ldap.ldap-bind-user = DN al utilizatorului de legare
prop.auth.model.ldap.ldap-bind-user.description = DN-ul utilizatorului care are permisiunea de a căuta utilizatori pentru a verifica accesul la aplicație cu filtrul specificat.
prop.auth.model.ldap.ldap-bind-user-pwd = Parola utilizatorului de legare
prop.auth.model.ldap.ldap-bind-user-pwd.description = Parola utilizatorului de legare.
prop.auth.model.ldap.ldap-filter = Filtru de utilizatori
prop.auth.model.ldap.ldap-filter.description = Filtrul folosit pentru a verifica accesul utilizatorilor la aplicație. Pentru utilizarea filtrului, configurarea utilizatorului de legare este obligatorie.
prop.auth.model.ldap.ldap-login = Parametru de autentificare a utilizatorului
prop.auth.model.ldap.ldap-login.description = Atribut LDAP folosit ca nume de autentificare al utilizatorului. Atributul trebuie să fie unic. Configurarea utilizatorului de legare este obligatorie pentru a utiliza acest parametru.
prop.auth.model.ldap.ldap-enable-ssl = Activează SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Utilizează o conexiune SSL securizată la serverul LDAP
prop.auth.model.ldap.ldap-ssl-cert = Certificat (format PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Certificat codificat PEM folosit pentru validarea serverului LDAP când SSL este activat
prop.auth.model.ldap.ldap-referral = Gestionarea referințelor
prop.auth.model.ldap.ldap-referral.description = Specificați modul de gestionare a referințelor LDAP. Valoarea implicită este 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Câmp pentru prenume
prop.auth.model.ldap.ldap-first-name-field.description = Atributul LDAP folosit pentru a completa prenumele din profilul utilizatorului dacă acesta este gol. Valorile existente sunt păstrate. Lăsați necompletat pentru a dezactiva maparea
prop.auth.model.ldap.ldap-last-name-field = Câmp pentru numele de familie
prop.auth.model.ldap.ldap-last-name-field.description = Atributul LDAP folosit pentru a completa numele de familie din profilul utilizatorului dacă acesta este gol. Valorile existente sunt păstrate. Lăsați necompletat pentru a dezactiva maparea
