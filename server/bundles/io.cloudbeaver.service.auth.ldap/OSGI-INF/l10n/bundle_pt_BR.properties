prop.auth.model.ldap.ldap-host = Host
prop.auth.model.ldap.ldap-host.description = Host do servidor LDAP
prop.auth.model.ldap.ldap-port = Porta
prop.auth.model.ldap.ldap-port.description = Porta do servidor LDAP, o padrão é 389
prop.auth.model.ldap.ldap-identifier-attr = Atributo identificador do usuário
prop.auth.model.ldap.ldap-identifier-attr.description = Atributo LDAP usado como ID do usuário. Será adicionado automaticamente ao início do valor de 'DN do usuário' durante a autorização se não for especificado explicitamente
prop.auth.model.ldap.ldap-dn = Nome distinto base
prop.auth.model.ldap.ldap-dn.description = Nome distinto base aplicável a todos os usuários, exemplo: dc=myOrg,dc=com. Será adicionado automaticamente ao final do valor de 'DN do usuário' durante a autorização se não for especificado explicitamente. Deixe em branco para usar o DN raiz.
prop.auth.model.ldap.ldap-bind-user = DN do usuário de vinculação
prop.auth.model.ldap.ldap-bind-user.description = DN do usuário com permissão para pesquisar usuários e verificar o acesso ao aplicativo com o filtro especificado.
prop.auth.model.ldap.ldap-bind-user-pwd = Senha do usuário de vinculação
prop.auth.model.ldap.ldap-bind-user-pwd.description = Senha do usuário de vinculação.
prop.auth.model.ldap.ldap-filter = Filtro de usuários
prop.auth.model.ldap.ldap-filter.description = Filtro usado para verificar o acesso dos usuários ao aplicativo. Para usar o filtro, é obrigatório configurar o usuário de vinculação.
prop.auth.model.ldap.ldap-login = Parâmetro de login do usuário
prop.auth.model.ldap.ldap-login.description = Atributo LDAP a ser usado como login do usuário. O atributo deve ser único. É obrigatório configurar o usuário de vinculação para usar este parâmetro.
prop.auth.model.ldap.ldap-enable-ssl = Ativar SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Usar uma conexão SSL segura com o servidor LDAP
prop.auth.model.ldap.ldap-ssl-cert = Certificado (formato PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Certificado codificado em PEM usado para validar o servidor LDAP quando o SSL está ativado
prop.auth.model.ldap.ldap-referral = Tratamento de referências
prop.auth.model.ldap.ldap-referral.description = Especifique como as referências LDAP são tratadas. O padrão é 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Campo do nome
prop.auth.model.ldap.ldap-first-name-field.description = Atributo LDAP usado para preencher o nome no perfil do usuário quando estiver vazio. Os valores existentes são preservados. Deixe em branco para desativar o mapeamento
prop.auth.model.ldap.ldap-last-name-field = Campo do sobrenome
prop.auth.model.ldap.ldap-last-name-field.description = Atributo LDAP usado para preencher o sobrenome no perfil do usuário quando estiver vazio. Os valores existentes são preservados. Deixe em branco para desativar o mapeamento
