prop.auth.model.ldap.ldap-host = Host
prop.auth.model.ldap.ldap-host.description = Host serwera LDAP
prop.auth.model.ldap.ldap-port = Port
prop.auth.model.ldap.ldap-port.description = Port serwera LDAP, domyślnie 389
prop.auth.model.ldap.ldap-identifier-attr = Atrybut identyfikatora użytkownika
prop.auth.model.ldap.ldap-identifier-attr.description = Atrybut LDAP używany jako identyfikator użytkownika. Zostanie automatycznie dodany na początku wartości „DN użytkownika” podczas autoryzacji, jeśli nie został podany jawnie
prop.auth.model.ldap.ldap-dn = Bazowa nazwa wyróżniająca
prop.auth.model.ldap.ldap-dn.description = Bazowa nazwa wyróżniająca stosowana do wszystkich użytkowników, przykład: dc=myOrg,dc=com. Zostanie automatycznie dodana na końcu wartości „DN użytkownika” podczas autoryzacji, jeśli nie została podana jawnie. Pozostaw puste, aby użyć głównej nazwy DN.
prop.auth.model.ldap.ldap-bind-user = DN użytkownika powiązania
prop.auth.model.ldap.ldap-bind-user.description = DN użytkownika z uprawnieniami do wyszukiwania użytkowników w celu sprawdzenia dostępu do aplikacji przy użyciu określonego filtra.
prop.auth.model.ldap.ldap-bind-user-pwd = Hasło użytkownika powiązania
prop.auth.model.ldap.ldap-bind-user-pwd.description = Hasło użytkownika powiązania.
prop.auth.model.ldap.ldap-filter = Filtr użytkowników
prop.auth.model.ldap.ldap-filter.description = Filtr używany do weryfikacji dostępu użytkowników do aplikacji. Użycie filtra wymaga skonfigurowania użytkownika powiązania.
prop.auth.model.ldap.ldap-login = Parametr loginu użytkownika
prop.auth.model.ldap.ldap-login.description = Atrybut LDAP używany jako login użytkownika. Atrybut musi być unikatowy. Użycie tego parametru wymaga skonfigurowania użytkownika powiązania.
prop.auth.model.ldap.ldap-enable-ssl = Włącz SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Użyj bezpiecznego połączenia SSL z serwerem LDAP
prop.auth.model.ldap.ldap-ssl-cert = Certyfikat (format PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Certyfikat w formacie PEM używany do weryfikacji serwera LDAP, gdy włączono SSL
prop.auth.model.ldap.ldap-referral = Obsługa odwołań
prop.auth.model.ldap.ldap-referral.description = Określ sposób obsługi odwołań LDAP. Wartość domyślna to 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Pole imienia
prop.auth.model.ldap.ldap-first-name-field.description = Atrybut LDAP używany do uzupełnienia pustego imienia w profilu użytkownika. Istniejące wartości zostają zachowane. Pozostaw puste, aby wyłączyć mapowanie
prop.auth.model.ldap.ldap-last-name-field = Pole nazwiska
prop.auth.model.ldap.ldap-last-name-field.description = Atrybut LDAP używany do uzupełnienia pustego nazwiska w profilu użytkownika. Istniejące wartości zostają zachowane. Pozostaw puste, aby wyłączyć mapowanie
