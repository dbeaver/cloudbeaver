prop.auth.model.ldap.ldap-host = Хост
prop.auth.model.ldap.ldap-host.description = Хост сервера LDAP
prop.auth.model.ldap.ldap-port = Порт
prop.auth.model.ldap.ldap-port.description = Порт сервера LDAP, за замовчуванням 389
prop.auth.model.ldap.ldap-identifier-attr = Атрибут ідентифікатора користувача
prop.auth.model.ldap.ldap-identifier-attr.description = Атрибут LDAP, що використовується як ідентифікатор користувача. Автоматично додається на початок значення 'User DN' під час авторизації, якщо його не вказано явно
prop.auth.model.ldap.ldap-dn = Базове розрізнювальне ім’я (DN)
prop.auth.model.ldap.ldap-dn.description = Базове розрізнювальне ім’я, спільне для всіх користувачів, наприклад: dc=myOrg,dc=com. Автоматично додається в кінець значення 'User DN' під час авторизації, якщо його не вказано явно. Залиште порожнім, щоб використовувати кореневий DN.
prop.auth.model.ldap.ldap-bind-user = DN користувача для прив’язування
prop.auth.model.ldap.ldap-bind-user.description = DN користувача з правами на пошук користувачів для перевірки доступу до застосунку за вказаним фільтром.
prop.auth.model.ldap.ldap-bind-user-pwd = Пароль користувача для прив’язування
prop.auth.model.ldap.ldap-bind-user-pwd.description = Пароль користувача для прив’язування.
prop.auth.model.ldap.ldap-filter = Фільтр користувачів
prop.auth.model.ldap.ldap-filter.description = Фільтр для перевірки доступу користувачів до застосунку. Для використання фільтра необхідно налаштувати користувача для прив’язування.
prop.auth.model.ldap.ldap-login = Параметр логіна користувача
prop.auth.model.ldap.ldap-login.description = Атрибут LDAP, що використовується як логін користувача. Атрибут має бути унікальним. Для використання цього параметра необхідно налаштувати користувача для прив’язування.
prop.auth.model.ldap.ldap-enable-ssl = Увімкнути SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Використовувати захищене SSL-з’єднання із сервером LDAP
prop.auth.model.ldap.ldap-ssl-cert = Сертифікат (у форматі PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Сертифікат у форматі PEM для перевірки автентичності сервера LDAP за ввімкненого SSL
prop.auth.model.ldap.ldap-referral = Обробка перенаправлень
prop.auth.model.ldap.ldap-referral.description = Укажіть спосіб обробки перенаправлень LDAP. За замовчуванням 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Поле імені
prop.auth.model.ldap.ldap-first-name-field.description = Атрибут LDAP для заповнення порожнього імені в профілі користувача. Наявні значення зберігаються. Залиште порожнім, щоб вимкнути зіставлення
prop.auth.model.ldap.ldap-last-name-field = Поле прізвища
prop.auth.model.ldap.ldap-last-name-field.description = Атрибут LDAP для заповнення порожнього прізвища в профілі користувача. Наявні значення зберігаються. Залиште порожнім, щоб вимкнути зіставлення
