prop.auth.model.ldap.ldap-host = Hôte
prop.auth.model.ldap.ldap-host.description = Hôte du serveur LDAP
prop.auth.model.ldap.ldap-port = Port
prop.auth.model.ldap.ldap-port.description = Port du serveur LDAP, 389 par défaut
prop.auth.model.ldap.ldap-identifier-attr = Attribut d'identification de l'utilisateur
prop.auth.model.ldap.ldap-identifier-attr.description = Attribut LDAP utilisé comme identifiant utilisateur. Il est automatiquement ajouté au début de la valeur « DN de l'utilisateur » lors de l'autorisation s'il n'est pas explicitement indiqué
prop.auth.model.ldap.ldap-dn = Nom distinctif de base
prop.auth.model.ldap.ldap-dn.description = Nom distinctif de base applicable à tous les utilisateurs, par exemple : dc=myOrg,dc=com. Il est automatiquement ajouté à la fin de la valeur « DN de l'utilisateur » lors de l'autorisation s'il n'est pas explicitement indiqué. Laisser vide pour utiliser le DN racine.
prop.auth.model.ldap.ldap-bind-user = DN de l'utilisateur de liaison
prop.auth.model.ldap.ldap-bind-user.description = DN de l'utilisateur autorisé à rechercher des utilisateurs afin de vérifier leur accès à l'application avec le filtre spécifié.
prop.auth.model.ldap.ldap-bind-user-pwd = Mot de passe de l'utilisateur de liaison
prop.auth.model.ldap.ldap-bind-user-pwd.description = Mot de passe de l'utilisateur de liaison.
prop.auth.model.ldap.ldap-filter = Filtre des utilisateurs
prop.auth.model.ldap.ldap-filter.description = Filtre utilisé pour vérifier l'accès des utilisateurs à l'application. La configuration de l'utilisateur de liaison est obligatoire pour utiliser ce filtre.
prop.auth.model.ldap.ldap-login = Paramètre de connexion de l'utilisateur
prop.auth.model.ldap.ldap-login.description = Attribut LDAP à utiliser comme identifiant de connexion de l'utilisateur. Cet attribut doit être unique. La configuration de l'utilisateur de liaison est obligatoire pour utiliser ce paramètre.
prop.auth.model.ldap.ldap-enable-ssl = Activer SSL
prop.auth.model.ldap.ldap-enable-ssl.description = Utiliser une connexion SSL sécurisée au serveur LDAP
prop.auth.model.ldap.ldap-ssl-cert = Certificat (format PEM)
prop.auth.model.ldap.ldap-ssl-cert.description = Certificat encodé en PEM utilisé pour valider le serveur LDAP lorsque SSL est activé
prop.auth.model.ldap.ldap-referral = Gestion des références LDAP
prop.auth.model.ldap.ldap-referral.description = Indiquer comment traiter les références LDAP. La valeur par défaut est 'ignore'
prop.auth.model.ldap.ldap-first-name-field = Champ du prénom
prop.auth.model.ldap.ldap-first-name-field.description = Attribut LDAP utilisé pour renseigner un prénom vide dans le profil utilisateur. Les valeurs existantes sont conservées. Laisser vide pour désactiver la correspondance
prop.auth.model.ldap.ldap-last-name-field = Champ du nom de famille
prop.auth.model.ldap.ldap-last-name-field.description = Attribut LDAP utilisé pour renseigner un nom de famille vide dans le profil utilisateur. Les valeurs existantes sont conservées. Laisser vide pour désactiver la correspondance
