prop.auth.model.ldap.ldap-host = 호스트
prop.auth.model.ldap.ldap-host.description = LDAP 서버 호스트
prop.auth.model.ldap.ldap-port = 포트
prop.auth.model.ldap.ldap-port.description = LDAP 서버 포트. 기본값은 389입니다
prop.auth.model.ldap.ldap-identifier-attr = 사용자 식별자 속성
prop.auth.model.ldap.ldap-identifier-attr.description = 사용자 ID로 사용할 LDAP 속성입니다. 명시적으로 지정하지 않으면 인가 시 '사용자 DN' 값의 앞에 자동으로 추가됩니다
prop.auth.model.ldap.ldap-dn = 기본 고유 이름
prop.auth.model.ldap.ldap-dn.description = 모든 사용자에게 적용되는 기본 고유 이름입니다. 예: dc=myOrg,dc=com. 명시적으로 지정하지 않으면 인가 시 '사용자 DN' 값의 끝에 자동으로 추가됩니다. 루트 DN을 사용하려면 비워 두세요.
prop.auth.model.ldap.ldap-bind-user = 바인드 사용자 DN
prop.auth.model.ldap.ldap-bind-user.description = 지정된 필터로 애플리케이션 접근 권한을 확인하기 위해 사용자를 검색할 권한이 있는 사용자의 DN입니다.
prop.auth.model.ldap.ldap-bind-user-pwd = 바인드 사용자 비밀번호
prop.auth.model.ldap.ldap-bind-user-pwd.description = 바인드 사용자의 비밀번호입니다.
prop.auth.model.ldap.ldap-filter = 사용자 필터
prop.auth.model.ldap.ldap-filter.description = 사용자의 애플리케이션 접근 권한을 확인하는 데 사용할 필터입니다. 이 필터를 사용하려면 바인드 사용자 설정이 필수입니다.
prop.auth.model.ldap.ldap-login = 사용자 로그인 매개변수
prop.auth.model.ldap.ldap-login.description = 사용자 로그인에 사용할 LDAP 속성입니다. 이 속성은 고유해야 합니다. 이 매개변수를 사용하려면 바인드 사용자 설정이 필수입니다.
prop.auth.model.ldap.ldap-enable-ssl = SSL 활성화
prop.auth.model.ldap.ldap-enable-ssl.description = LDAP 서버에 안전한 SSL 연결을 사용합니다
prop.auth.model.ldap.ldap-ssl-cert = 인증서(PEM 형식)
prop.auth.model.ldap.ldap-ssl-cert.description = SSL이 활성화된 경우 LDAP 서버를 검증하는 데 사용하는 PEM 인코딩 인증서입니다
prop.auth.model.ldap.ldap-referral = 참조 처리
prop.auth.model.ldap.ldap-referral.description = LDAP 참조를 처리하는 방법을 지정합니다. 기본값은 'ignore'입니다
prop.auth.model.ldap.ldap-first-name-field = 이름 필드
prop.auth.model.ldap.ldap-first-name-field.description = 사용자 프로필의 이름이 비어 있을 때 값을 채우는 데 사용할 LDAP 속성입니다. 기존 값은 유지됩니다. 매핑을 비활성화하려면 비워 두세요
prop.auth.model.ldap.ldap-last-name-field = 성 필드
prop.auth.model.ldap.ldap-last-name-field.description = 사용자 프로필의 성이 비어 있을 때 값을 채우는 데 사용할 LDAP 속성입니다. 기존 값은 유지됩니다. 매핑을 비활성화하려면 비워 두세요
