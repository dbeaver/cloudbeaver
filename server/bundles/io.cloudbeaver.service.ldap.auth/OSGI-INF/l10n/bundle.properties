ldap-host = Host
ldap-host.description = LDAP server host
ldap-port = Port
ldap-port.description = LDAP server port, default is 389
ldap-identifier-attr = User identifier attribute
ldap-identifier-attr.description = LDAP attribute used as a user ID. Will be automatically added to the beginning of the 'User DN' value during authorization if not explicitly specified
ldap-dn = Base Distinguished Name
ldap-dn.description = Base Distinguished Name applicable for all users, example: dc=myOrg,dc=com. Will be automatically added to the end of the 'User DN' value during authorization if not explicitly specified
ldap-bind-user = Bind User DN
ldap-bind-user.description = DN of user, who has permissions to search for users to check access to the application with the specified filter.
ldap-bind-user-pwd = Bind User Password
ldap-bind-user-pwd.description = Bind user password.
ldap-filter = User Filter
ldap-filter.description = Filter that will be used to verify users access to the application. To use the filter, the bind user configuration is mandatory.
user-dn = User DN
user-dn.description = LDAP user name
password = User password
password.description = LDAP user password

