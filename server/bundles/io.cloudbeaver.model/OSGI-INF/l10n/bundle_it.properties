feature.resetCredentialsOnTargetChange.label = Reimposta le credenziali quando cambia la destinazione
feature.resetCredentialsOnTargetChange.description = Impedisce il riutilizzo delle credenziali di database e rete salvate quando cambia l'host, l'URL o il percorso di rete della connessione. Disabilitare solo se tutti gli utenti che possono modificare le connessioni sono ritenuti affidabili per l'uso delle credenziali memorizzate.
