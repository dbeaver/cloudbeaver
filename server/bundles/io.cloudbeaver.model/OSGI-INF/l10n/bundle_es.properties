feature.resetCredentialsOnTargetChange.description = Impide reutilizar las credenciales guardadas de bases de datos y de red cuando cambia el host, la URL o la ruta de red de la conexión. Desactive esta opción solo si se pueden confiar las credenciales almacenadas a todos los usuarios que pueden editar conexiones.
