query sqlGenerateResultSetQuery(
  $projectId: ID
  $connectionId: ID!
  $contextId: ID!
  $generatorId: SQLResultSetGeneratorId!
  $resultsId: ID!
  $selectedRows: [SQLResultRow!]!
  $useFullyQualifiedNames: Boolean
  $compactSql: Boolean
) {
  sqlGenerateResultSetQuery(
    projectId: $projectId
    connectionId: $connectionId
    contextId: $contextId
    generatorId: $generatorId
    resultsId: $resultsId
    selectedRows: $selectedRows
    useFullyQualifiedNames: $useFullyQualifiedNames
    compactSql: $compactSql
  )
}
