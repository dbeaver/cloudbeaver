query getUserConnections(
  $projectId: ID
  $connectionId: ID
  $projectIds: [ID!]
  $includeCredentialsSaved: Boolean!
  $includeAuthNeeded: Boolean!
  $includeProperties: Boolean!
) {
  connections: userConnections(projectId: $projectId, id: $connectionId, projectIds: $projectIds) {
    ...DatabaseConnection
  }
}
