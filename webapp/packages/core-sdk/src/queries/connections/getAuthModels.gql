query getAuthModels {
  models: authModels {
    id
    displayName
    description
    icon
    requiresLocalConfiguration
    requiredAuth
    properties {
      required
      id
      displayName
      description
      category
      dataType
      validValues
      allowCustomValue
      defaultValue
      length
      features
      order
      conditions {
        ...Condition
      }
    }
  }
}
