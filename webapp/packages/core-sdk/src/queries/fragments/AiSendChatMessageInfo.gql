fragment AiSendChatMessageInfo on AISendChatMessageInfo {
  conversation {
    id
    dataSourceId {
      projectId
      connectionId
    }
    caption
    time
    waitingForResponse
    promptGeneratorId
  }

  userMessage {
    ...AiChatMessage
  }

  assistantMessage {
    ...AiChatMessage
  }
}
