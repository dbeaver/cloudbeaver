mutation updateAiProfile($config: AIConfigurationProfileInput!) {
  profile: aiUpdateProfile(config: $config) {
    id
    name
    engineId
    global
    credentialsSaved
    accountAuthentication
    deviceAuthorizationAvailable
    accountProvider
    tokenSaved
    account {
      email
    }
    configuration {
      ...ObjectPropertyInfo
    }
  }
}
