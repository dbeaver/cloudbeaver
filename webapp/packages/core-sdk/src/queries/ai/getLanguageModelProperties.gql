query getEngineProperties($engineId: ID!, $profileId: ID, $settings: AIEngineConfig) {
  properties: aiListEngineProperties(engineId: $engineId, profileId: $profileId, settings: $settings) {
    id
    displayName
    description
    hint
    value
    category
    required
    dataType
    defaultValue
    constraints {
      min
      max
    }
    validValues
    allowCustomValue
    length
    features
    order
    conditions {
      ...Condition
    }
  }
}
