query sqlGenerateEntityQuery(
  $generatorId: String!
  $options: Object!
  $nodePathList: [String!]!
  $useFullyQualifiedNames: Boolean
  $compactSql: Boolean
) {
  sqlGenerateEntityQuery(
    generatorId: $generatorId
    options: $options
    nodePathList: $nodePathList
    useFullyQualifiedNames: $useFullyQualifiedNames
    compactSql: $compactSql
  )
}
