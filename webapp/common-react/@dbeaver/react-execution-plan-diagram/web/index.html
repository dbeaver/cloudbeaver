<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execution Plan Diagram</title>
    <link rel="stylesheet" href="../dist/execution-plan-diagram.css" />
    <style>
      html,
      body,
      #plan-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .custom-toolbar {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        gap: 4px;
        z-index: 10;
      }

      .custom-toolbar button {
        width: 32px;
        height: 32px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .custom-toolbar button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div id="plan-container"></div>

    <div class="custom-toolbar">
      <button title="Zoom in" onclick="planZoomIn()">+</button>
      <button title="Zoom out" onclick="planZoomOut()">−</button>
      <button title="Fit to screen" onclick="planFitToScreen()">⊡</button>
      <button title="Reset view" onclick="planResetView()">↺</button>
    </div>

    <script src="../dist/execution-plan-diagram.js"></script>
    <script src="./mock-data.js"></script>
    <script>
      window.__PLAN_INIT_TRANSLATIONS__ = {
        sql_execution_plan_diagram_cost: 'Cost',
        sql_execution_plan_diagram_rows: 'Rows',
        sql_execution_plan_diagram_time: 'Time',
        sql_execution_plan_diagram_expand_node: 'Expand {arg:name}',
        sql_execution_plan_diagram_collapse_node: 'Collapse {arg:name}',
      };
    </script>
  </body>
</html>
